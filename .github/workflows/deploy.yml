name: CI/CD Pipeline

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15

    env:
      APP_NAME: api-backend
      NODE_ENV: production

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Preparar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, curl, fileinfo, mbstring, openssl, pdo, tokenizer, xml, ctype, bcmath
          tools: composer
          coverage: none

      - name: Verificar PHP
        timeout-minutes: 1
        run: |
          set -e
          php -v
          composer --version

          php -r 'exit(version_compare(PHP_VERSION, "8.2.0", ">=") ? 0 : 1);'

      - name: Verificar Node y PM2
        timeout-minutes: 1
        run: |
          set -e
          command -v node
          command -v npm
          command -v pm2

          node --version
          npm --version
          pm2 --version

      - name: Instalar dependencias PHP
        working-directory: backend
        timeout-minutes: 5
        run: |
          set -e
          composer validate --no-check-publish
          composer install \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --optimize-autoloader \
            --no-dev
