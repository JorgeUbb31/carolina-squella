name: CI/CD Pipeline

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15

    env:
      APP_NAME: api-backend
      NODE_ENV: production

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Verificar herramientas
        timeout-minutes: 1
        run: |
          set -e
          command -v php
          command -v composer
          command -v pm2

          php -v
          composer --version
          pm2 --version

          php -r 'exit(version_compare(PHP_VERSION, "8.2.0", ">=") ? 0 : 1);'

      - name: Instalar dependencias PHP
        working-directory: backend
        timeout-minutes: 5
        run: |
          set -e

          composer validate --no-check-publish

          composer install \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --optimize-autoloader \
            --no-dev

      - name: Crear configuración del backend
        timeout-minutes: 1
        run: |
          set -e

          ENV_FILE="$HOME/backend.env"

          test -f "$ENV_FILE" || {
            echo "No existe $ENV_FILE"
            exit 1
          }

          test -r "$ENV_FILE" || {
            echo "El runner no puede leer $ENV_FILE"
            exit 1
          }

          cp "$ENV_FILE" backend/.env
          chmod 600 backend/.env

      

      - name: Preparar Laravel
        working-directory: backend
        timeout-minutes: 2
        run: |
          set -e

          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache

      - name: Reiniciar backend Laravel con PM2
        working-directory: backend
        timeout-minutes: 2
        env:
          APP_PORT: "8000"
        run: |
          set -e

          test -f artisan || {
            echo "No existe backend/artisan"
            exit 1
          }

          pm2 delete "$APP_NAME" >/dev/null 2>&1 || true

          pm2 start artisan \
            --name "$APP_NAME" \
            --interpreter php \
            -- serve \
            --host 0.0.0.0 \
            --port "$APP_PORT"

          pm2 save
          pm2 status "$APP_NAME"

      - name: Verificar backend
        timeout-minutes: 1
        run: |
          set -e

          sleep 2

          curl --fail --silent --show-error \
            --max-time 10 \
            http://127.0.0.1:8000/ >/dev/null

          echo "Backend Laravel funcionando correctamente"
