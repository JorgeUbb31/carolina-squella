name: CI/CD Pipeline

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    env:
      APP_NAME: api-backend
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify tools
        run: |
          php --version
          composer --version
          node --version
          npm --version

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          composer validate --no-check-publish
          composer install \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --optimize-autoloader \
            --no-dev

      - name: Install Node dependencies
        working-directory: backend
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --omit=dev
          elif [ -f package.json ]; then
            npm install --omit=dev
          else
            echo "No package.json found"
            exit 1
          fi

      - name: Create backend env file from GitHub secret
        shell: bash
        run: |
          mkdir -p backend/src/config
          printf '%s' "${{ secrets.BACKEND_ENV }}" > backend/src/config/.env

      - name: Ensure PM2 exists
        shell: bash
        run: |
          if ! command -v pm2 >/dev/null 2>&1; then
            npm install --global pm2
          fi
          pm2 --version

      - name: Restart backend with PM2
        working-directory: backend
        shell: bash
        run: |
          set -e

          if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
            pm2 restart "$APP_NAME" --update-env
          else
            pm2 start "node src/index.js" --name "$APP_NAME" --watch false
          fi

          pm2 save
          pm2 status